name: Documentation
description: Create a documentation task for Sticker Studio
title: "[Docs] "
labels:
  - "type: documentation"
body:
  - type: textarea
    id: documentation
    attributes:
      label: Documentation
      description: What needs to be documented?
      placeholder: Describe the documentation that needs to be created or updated.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Why is this documentation needed?
      placeholder: Explain what this documentation will help users, contributors, or maintainers understand.
    validations:
      required: true

  - type: checkboxes
    id: content
    attributes:
      label: Content
      description: What should the documentation cover?
      options:
        - label: Document the relevant concepts or features.
        - label: Include relevant examples or explanations.
        - label: Verify that the documentation is accurate.
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Where should the documentation be added?
      placeholder: "Example: docs/ARCHITECTURE.md"
    validations:
      required: true

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Add any relevant information, references, or requirements.
      placeholder: Anything else that should be considered?
