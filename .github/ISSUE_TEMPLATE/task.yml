name: Task
description: Create a development or project task for Sticker Studio
title: "[Task] "
labels:
  - "type: task"
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done?
      placeholder: Clearly describe the work that needs to be completed.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Why does this need to be done?
      placeholder: Explain why this task is necessary.
    validations:
      required: true

  - type: checkboxes
    id: requirements
    attributes:
      label: Requirements
      description: What needs to be completed for this task to be considered done?
      options:
        - label: Requirement 1
        - label: Requirement 2
        - label: Requirement 3
    validations:
      required: true

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Add any relevant information.
      placeholder: Additional context, references, or implementation notes.
